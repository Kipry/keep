<style>

#stripView{position:absolute;left:0;top:560px;width:1080px;height:1180px;overflow:hidden;z-index:3;

.cell{position:absolute;width:224px;height:280px;border-radius:6px;background-size:cover;background-position:center;

#pic{position:absolute;left:40px;right:40px;top:30px;bottom:66px;border-radius:8px;background-size:cover;background-position:center;overflow:hidden}

#prog i{position:absolute;left:0;top:0;bottom:0;background:#F0873A;border-radius:5px;display:block}
#filmLabel{position:absolute;left:0;right:0;top:1440px;text-align:center;font-family:Mono;font-size:28px;
  letter-spacing:.14em;color:rgba(255,255,255,.55);z-index:4}

<script>
// ─── Text & Timing — alles, was man zum Anpassen braucht, steht hier ───────────
const CAPTIONS = [
  { a: 0.25, b: 2.62, y: 820,  text: 'Der Moment ist gleich vorbei', words: true },
  { a: 2.72, b: 4.30, y: 210,  eyebrow: 'Sperrbildschirm', text: 'Ein Tipp.\nOhne Entsperren' },
  { a: 4.30, b: 7.30, y: 210,  eyebrow: 'Aufnehmen', text: 'Schneller als der Moment vorbei ist' },
  { a: 7.55, b: 9.80, y: 1290, text: 'Halte ihn fest,\nohne ihn zu verpassen', size: 72 },
  { a: 9.95, b: 14.62, y: 210, eyebrow: 'Tag 1', counter: true, text: 'Jeden Tag ein Clip' },
  { a: 14.62, b: 17.45, y: 210, eyebrow: 'Export', text: 'Clips rein. Film raus' },
];
const REC_START = 4.6, REC_LEN = 1.618;   // φ — die voreingestellte Cliplänge der App
const DAYS = 212, CELLS = 28;

// ─── Helfer ────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eout = x => 1 - Math.pow(1 - x, 3);
const ein = x => x * x * x;
const back = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;

// ─── Motive im Stil der Onboarding-Mocks ─────────────────────────────────────
const svg = s => `url("data:image/svg+xml;utf8,${encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100' preserveAspectRatio='xMidYMid slice'>${s}</svg>`)}")`;
const SCENES = [

  svg(`<defs><linearGradient id='g' x2='0' y2='1'><stop offset='0' stop-color='#0E1532'/><stop offset='1' stop-color='#232A50'/></linearGradient></defs><rect width='80' height='100' fill='url(#g)'/><g fill='#fff' opacity='.7'><circle cx='12' cy='12' r='.6'/><circle cx='30' cy='7' r='.5'/><circle cx='62' cy='14' r='.6'/><circle cx='70' cy='5' r='.4'/></g><g fill='#131936'><rect x='4' y='44' width='13' height='56'/><rect x='19' y='30' width='12' height='70'/><rect x='33' y='50' width='11' height='50'/><rect x='46' y='24' width='14' height='76'/><rect x='62' y='40' width='14' height='60'/></g><g fill='#F2C66D' opacity='.85'><rect x='22' y='36' width='2' height='2'/><rect x='26' y='44' width='2' height='2'/><rect x='49' y='31' width='2' height='2'/><rect x='54' y='45' width='2' height='2'/><rect x='66' y='50' width='2' height='2'/><rect x='8' y='52' width='2' height='2'/></g><circle cx='14' cy='86' r='6' fill='#E8A35C' opacity='.75'/><circle cx='36' cy='92' r='5' fill='#D9577A' opacity='.7'/><circle cx='58' cy='87' r='6' fill='#4FB7A0' opacity='.7'/><circle cx='72' cy='94' r='4' fill='#E8A35C' opacity='.7'/>`),

  svg(`<defs><linearGradient id='g' x2='0' y2='1'><stop offset='0' stop-color='#9FD1DE'/><stop offset='1' stop-color='#EAF3EE'/></linearGradient></defs><rect width='80' height='100' fill='url(#g)'/><circle cx='62' cy='18' r='7' fill='#FFF6DA'/><rect y='52' width='80' height='18' fill='#2F8FA3'/><path d='M0 66 Q10 62 20 66 T40 66 T60 66 T80 66 V72 H0Z' fill='#fff' opacity='.7'/><rect y='70' width='80' height='30' fill='#EAD3A8'/><circle cx='22' cy='84' r='3' fill='#D9577A'/>`),

  svg(`<rect width='80' height='100' fill='#1A0F2E'/><polygon points='22,0 30,0 46,100 8,100' fill='#F0873A' opacity='.32'/><polygon points='52,0 60,0 76,100 36,100' fill='#B64AD6' opacity='.3'/><g fill='#FFE9B8'><circle cx='26' cy='4' r='2.4'/><circle cx='56' cy='4' r='2.4'/></g><g fill='#0A0613'><circle cx='8' cy='92' r='7'/><circle cx='22' cy='90' r='8'/><circle cx='38' cy='93' r='7'/><circle cx='54' cy='89' r='8'/><circle cx='70' cy='92' r='7'/><rect y='92' width='80' height='8'/></g>`),
];

// Warme Abendszene hinter dem Sucher: Bokeh statt Personen.
function bokeh(t, k) {
  const L = [
    [22, 30, 150, 'rgba(255,196,120,.55)'], [70, 22, 110, 'rgba(255,176,96,.5)'],
    [82, 58, 170, 'rgba(240,135,58,.42)'],  [15, 70, 120, 'rgba(255,214,150,.4)'],
    [48, 44, 260, 'rgba(255,150,70,.22)'],  [60, 82, 140, 'rgba(255,190,120,.35)'],
    [35, 12, 90, 'rgba(255,230,180,.45)'],  [92, 90, 100, 'rgba(255,160,90,.35)'],
  ];
  const g = L.map(([x, y, r, c], i) => {
    const dx = Math.sin(t * .45 + i * 1.7) * 2.2, dy = Math.cos(t * .38 + i) * 1.8;
    return `radial-gradient(circle at ${x + dx}% ${y + dy}%, ${c} 0, ${c.replace(/,[\d.]+\)$/, ',0.18)')} ${r * k * .55}px, transparent ${r * k}px)`;
  });
  return g.join(',') + `,radial-gradient(ellipse at 50% 38%, #7A4426 0, #3A2014 45%, #120B08 100%)`;
}

// ─── Aufbau ────────────────────────────────────────────────────────────────────
const caps = CAPTIONS.map((c, i) => {
  const el = document.createElement('div'); el.className = 'cap'; el.style.top = c.y + 'px';
  const words = c.text.split(' ');
  el.innerHTML = (c.eyebrow ? `<div class="eyebrow${c.counter ? ' amber' : ''}">${c.eyebrow}</div>` : '') +
    `<div class="head"${c.size ? ` style="font-size:${c.size}px"` : ''}>` + (c.words
      ? words.map((w, j) => `<span class="word">${w}${j === words.length - 1 ? '<span class="dot">.</span>' : ''}</span>`).join(' ')
      : `${c.text.replace('\n', '<br>')}<span class="dot">.</span>`) + `</div>`;
  $('caps').appendChild(el);
  return { ...c, el, words: c.words ? [...el.querySelectorAll('.word')] : null, eb: el.querySelector('.eyebrow') };
});

const holes = n => `<div class="holes" style="top:0">${'<i></i>'.repeat(n)}</div><div class="holes" style="bottom:0">${'<i></i>'.repeat(n)}</div>`;
const ROW_PITCH = 368, ROWS = CELLS / 4;
const rows = [], cells = [];
const MONTHS = ['Jan', 'Feb', 'März', 'Apr', 'Mai', 'Juni', 'Juli', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
for (let r = 0; r < ROWS; r++) {
  const row = document.createElement('div'); row.className = 'row'; row.style.top = r * ROW_PITCH + 'px';
  row.innerHTML = holes(22); $('stripView').appendChild(row); rows.push(row);
}
for (let i = 0; i < CELLS; i++) {
  const r = Math.floor(i / 4), c = i % 4;
  const el = document.createElement('div'); el.className = 'cell';
  el.style.left = (60 + 14 + c * 236) + 'px'; el.style.top = (r * ROW_PITCH + 33) + 'px';
  el.style.backgroundImage = SCENES[(i * 3 + r) % SCENES.length];
  const d = new Date(2026, 1, 1 + Math.round(i * (DAYS - 1) / (CELLS - 1)));
  el.innerHTML = `<em>${d.getDate()}. ${MONTHS[d.getMonth()]}</em>`;
  $('stripView').appendChild(el);
  cells.push({ el, r, c, at: 10.05 + 3.9 * Math.pow(i / CELLS, .65) });
}
document.querySelectorAll('.holesV').forEach(h => h.innerHTML = '<i></i>'.repeat(13));

// ─── Ein Bild zum Zeitpunkt t ─────────────────────────────────────────────────
function render(t) {
  // Grundlicht: glimmt am Anfang auf, bleibt als warmer Schein oben
  $('glow').style.background = `radial-gradient(ellipse 70% 42% at 50% ${lerp(46, 24, eio(p(t, 2.4, 3.4)))}%, rgba(240,135,58,${
    .16 * eout(p(t, 0, 1.4)) * (1 - p(t, 17.2, 17.6))}) 0, transparent 100%)`;

  // Bildunterschriften
  for (const c of caps) {
    const vin = eout(p(t, c.a, c.a + .45)), vout = eio(p(t, c.b - .3, c.b));
    c.el.style.opacity = c.words ? 1 - vout : vin * (1 - vout);
    c.el.style.transform = `translateY(${(1 - vin) * 26 - vout * 14}px)`;
    if (c.words) c.words.forEach((w, j) => {
      const q = eout(p(t, c.a + j * .26, c.a + j * .26 + .5));
      w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * 34}px)`;
    });
    if (c.counter) c.eb.textContent = `Tag ${1 + Math.round((DAYS - 1) * Math.pow(p(t, 10.05, 14.3), 1.7))}`;
  }

  // Telefon: kommt von unten, geht nach unten
  const yIn = (1 - eout(p(t, 2.6, 3.35))) * 1500, yOut = ein(p(t, 7.2, 8.0)) * 1500;
  $('phone').style.transform = `translateY(${yIn + yOut}px) scale(.9)`;
  $('phone').style.opacity = t < 2.55 || t > 8.1 ? 0 : 1;

  // Sperrbildschirm: Finger, Druck, Welle
  const touch = p(t, 3.25, 3.5) * (1 - p(t, 3.75, 3.95));
  $('finger').style.opacity = touch;
  $('finger').style.transform = `scale(${lerp(1.25, 1, eout(p(t, 3.25, 3.5)))})`;
  const press = eout(p(t, 3.42, 3.56)) * (1 - eout(p(t, 3.62, 3.8)));
  $('ctrl').style.transform = `scale(${1 - .12 * press})`;
  const rip = p(t, 3.5, 4.05);
  $('ripple').style.opacity = rip > 0 && rip < 1 ? (1 - rip) * .9 : 0;
  $('ripple').style.transform = `scale(${lerp(.8, 2.3, eout(rip))})`;

  // Sucher öffnet sich — direkt, ohne Face ID
  const open = eio(p(t, 3.85, 4.25));
  $('vf').style.opacity = open;
  $('vf').style.transform = `scale(${lerp(1.06, 1, open)})`;
  $('lock').style.opacity = 1 - open;
  $('vfScene').style.background = bokeh(t, 1);

  // Aufnahme: Ring läuft in φ Sekunden voll
  const rec = clamp(t - REC_START, 0, REC_LEN), recOn = t >= REC_START && t < REC_START + REC_LEN + .12;
  $('arc').setAttribute('stroke-dashoffset', 502.65 * (1 - rec / REC_LEN));
  $('arc').style.opacity = t >= REC_START && t < 6.5 ? 1 : 0;
  const coreQ = eout(p(t, REC_START - .04, REC_START + .22)) * (1 - eout(p(t, 6.24, 6.45)));
  const side = lerp(108, 50, coreQ), rx = lerp(54, 12, coreQ);
  const core = $('core');
  core.setAttribute('x', 85 - side / 2); core.setAttribute('y', 85 - side / 2);
  core.setAttribute('width', side); core.setAttribute('height', side); core.setAttribute('rx', rx);
  core.setAttribute('fill', coreQ > .02 ? '#F0873A' : '#E53935');
  $('pill').style.opacity = recOn ? 1 : 0;
  $('pillT').textContent = rec.toFixed(1) + 's';
  $('bar').style.opacity = t > REC_START ? lerp(1, .4, p(t, REC_START, REC_START + .2)) : 1;
  const saved = p(t, 6.32, 6.62);
  $('saved').style.opacity = eout(saved);
  // Wie in der echten Extension: nach dem Sichern steht nur noch die Bestätigung da.
  $('chrome').style.opacity = 1 - eout(saved);
  $('saved').style.transform = `scale(${lerp(.82, 1, back(saved))})`;

  // Der Moment geht weiter: Szene füllt den Bildschirm
  const bleedIn = eout(p(t, 7.1, 7.9)), bleedOut = eio(p(t, 9.55, 10.15));
  $('bleed').style.background = bokeh(t, 2.1);
  $('bleed').style.opacity = bleedIn * (1 - bleedOut);
  $('bleed').style.transform = `scale(${lerp(1.14, 1, eout(p(t, 7.1, 9.8)))})`;
  $('bleedShade').style.opacity = bleedIn * (1 - bleedOut);

  // Filmstreifen füllt sich, immer schneller
  const scroll = ROW_PITCH * 4 * eio(p(t, 11.4, 14.5));
  const merge = t >= 14.6;
  rows.forEach((row, r) => {
    const first = cells[r * 4].at;
    const q = eout(p(t, first - .05, first + .25)) * (1 - eio(p(t, 14.6, 15.0)));
    row.style.opacity = q;
    row.style.transform = `translateY(${-scroll}px)`;
  });
  cells.forEach((c, i) => {
    const q = eout(p(t, c.at, c.at + .24));
    let tx = 0, ty = -scroll, s = lerp(.72, 1, back(q)), o = q;
    if (merge) {
      const m = eio(p(t, 14.62 + (CELLS - i) * .008, 15.35 + (CELLS - i) * .008));
      const cx = 60 + 14 + c.c * 236 + 112, cy = 560 + c.r * ROW_PITCH + 33 + 140 - scroll;
      tx = (540 - cx) * m; ty += (1000 - cy) * m; s *= lerp(1, .22, m); o *= 1 - p(m, .55, 1);
    }
    c.el.style.opacity = o;
    c.el.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  });
  $('stripView').style.opacity = t > 9.9 && t < 15.6 ? 1 : 0;

  // Ein Film: zusammenziehen, Play, Schnellmontage
  const fIn = p(t, 15.1, 15.7), fOut = p(t, 17.25, 17.6);
  $('film').style.opacity = eout(fIn) * (1 - fOut);
  $('film').style.transform = `scale(${lerp(.62, 1, back(fIn))})`;
  const playIn = eout(p(t, 15.55, 15.85)), tap = eout(p(t, 15.98, 16.08)) * (1 - p(t, 16.08, 16.2)),
        playOut = eio(p(t, 16.08, 16.3));
  $('play').style.opacity = playIn * (1 - playOut);
  $('play').style.transform = `scale(${lerp(.6, 1, playIn) * (1 - .1 * tap)})`;
  const run = p(t, 16.1, 17.35);
  const frame = t < 16.1 ? 0 : Math.floor((t - 16.1) / .15) % SCENES.length;
  $('pic').style.backgroundImage = SCENES[frame];
  $('prog').firstElementChild.style.width = (run * 100) + '%';
  $('filmLabel').style.opacity = eout(p(t, 15.5, 15.9)) * (1 - fOut);

  // Endkarte: der Ladescreen der App
  $('end').style.opacity = eio(p(t, 17.35, 17.95));
  $('endLine').style.opacity = eout(p(t, 18.2, 18.75));
  $('endLine').style.transform = `translateY(${(1 - eout(p(t, 18.2, 18.75))) * 18}px)`;
}
window.render = render;
render(0);
</script>
</body></html>
